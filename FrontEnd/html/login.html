<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie - SkySecure</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="bg-slate-50 text-slate-900 flex items-center justify-center min-h-screen">
    <div id="app" v-cloak class="w-full max-w-md p-4">
        
        <div class="bg-white p-10 rounded-[2.5rem] shadow-xl border border-slate-100">
            <div class="flex justify-center mb-6 cursor-pointer" @click="goToHome">
                <img src="logo.jpg" alt="Logo" class="h-16 w-auto object-contain">
            </div>

                <div class="flex p-1.5 bg-slate-100 rounded-2xl mb-8 border border-slate-200 shadow-inner">
                    
                    <button type="button" @click="isRegisterMode = false"
                            :class="[!isRegisterMode ? 'bg-white text-slate-900 shadow-md rounded-xl' : 'text-slate-400 hover:text-slate-600', 'flex-1 py-3 text-xs sm:text-sm font-black uppercase tracking-widest transition-all duration-300 ease-out']">
                        Logowanie
                    </button>
                    
                    <button type="button" @click="isRegisterMode = true"
                            :class="[isRegisterMode ? 'bg-white text-slate-900 shadow-md rounded-xl' : 'text-slate-400 hover:text-slate-600', 'flex-1 py-3 text-xs sm:text-sm font-black uppercase tracking-widest transition-all duration-300 ease-out']">
                        Rejestracja
                    </button>

                </div>

            <form @submit.prevent="handleAuth" class="space-y-4">
                <div v-if="isRegisterMode" class="grid grid-cols-2 gap-4">
                    <input v-model="form.imie" type="text" placeholder="Imię" class="p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:border-blue-500 focus:bg-white transition-all" required>
                    <input v-model="form.nazwisko" type="text" placeholder="Nazwisko" class="p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:border-blue-500 focus:bg-white transition-all" required>
                </div>
                
                <input v-model="form.email" type="email" placeholder="Email" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:border-blue-500 focus:bg-white transition-all" required>
                <input v-model="form.password" type="password" placeholder="Hasło" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:border-blue-500 focus:bg-white transition-all" required>
                
                <button type="submit" class="w-full bg-slate-900 text-white font-bold py-5 rounded-2xl hover:bg-blue-600 transition-all mt-4">
                    {{ isRegisterMode ? 'Zarejestruj się' : 'Zaloguj się' }}
                </button>
            </form>
        </div>

    </div>

    <script type="module" src="js/login.js"></script>
</body>
</html>
