<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkySecure Airlines - Sprint 4</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="style.css"> </head>
<body class="bg-slate-50 text-slate-900">
    <div id="app" v-cloak>
        <header class="bg-white shadow-sm p-3 border-b border-slate-200 sticky top-0 z-50">
            <div class="container mx-auto flex justify-between items-center">
                
                <div class="flex items-center space-x-3 cursor-pointer" @click="$router.push('/')">
                    <img src="logo.jpg" alt="SkySecure Logo" class="h-12 w-auto object-contain">
                    <div class="flex flex-col">
                        <span class="text-xl font-black tracking-tight leading-none text-slate-800 uppercase">SkySecure</span>
                        <span class="text-xs font-bold text-blue-600 tracking-widest uppercase">Airlines</span>
                    </div>
                </div>

                <nav class="space-x-6 flex items-center">
                    <router-link to="/" class="hidden md:block hover:text-blue-600 font-semibold transition-colors">Strona Główna</router-link>
                    
                    <router-link v-if="!isLoggedIn" to="/login" class="bg-blue-600 text-white px-6 py-2.5 rounded-xl hover:bg-blue-700 transition-all shadow-lg shadow-blue-100 font-bold">
                        Zaloguj się
                    </router-link>
                    
                    <div v-else class="flex items-center space-x-4">
                        <span class="text-sm font-semibold text-slate-700">{{ userEmail }}</span>
                        <button @click="logout" class="p-2 bg-slate-100 rounded-lg text-slate-400 hover:text-red-500 hover:bg-red-50 transition-all">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                            </svg>
                        </button>
                    </div>
                </nav>
            </div>
        </header>

        <main class="container mx-auto mt-6 mb-16 p-4">
            <router-view v-slot="{ Component }">
                <transition name="page" mode="out-in">
                    <component :is="Component" />
                </transition>
            </router-view>
        </main>
    </div>

    <script>
        const { createApp, ref, computed, reactive } = Vue;
        // DODANE: useRoute i useRouter do obsługi parametrów URL
        const { createRouter, createWebHashHistory, useRoute, useRouter } = VueRouter;

        const API_URL = 'http://127.0.0.1/api'; 

        // -- LOGIKA PRZECHOWYWANIA SESJI --
        const authToken = ref(localStorage.getItem('skysecure_token') || null);
        const userEmail = ref(localStorage.getItem('skysecure_user_email') || '');

        const setSession = (token, email) => {
            authToken.value = token;
            userEmail.value = email;
            localStorage.setItem('skysecure_token', token);
            localStorage.setItem('skysecure_user_email', email);
        };

        const clearSession = () => {
            authToken.value = null;
            userEmail.value = '';
            localStorage.removeItem('skysecure_token');
            localStorage.removeItem('skysecure_user_email');
        };

        // -- STRONA GŁÓWNA --
        const Home = { 
            setup() {
                const searchForm = reactive({ from: '', to: '', date: '' });
                const flights = ref([]);
                const hasSearched = ref(false);
                const isLoading = ref(false);

                const searchFlights = async () => {
                    isLoading.value = true;
                    hasSearched.value = true;
                    flights.value = [];
                    try {
                        const params = {};
                        if (searchForm.from) params.from = searchForm.from;
                        if (searchForm.to) params.to = searchForm.to;
                        if (searchForm.date) params.date = searchForm.date;
                        const response = await axios.get(`${API_URL}/flights/`, { params });
                        flights.value = response.data;
                    } catch (error) {
                        alert("Błąd podczas wyszukiwania lotów.");
                    } finally {
                        isLoading.value = false;
                    }
                };

                const formatTime = (d) => new Date(d).toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' });
                const formatDate = (d) => new Date(d).toLocaleDateString('pl-PL', { day: 'numeric', month: 'short', year: 'numeric' });
                const formatPrice = (p) => parseFloat(p).toLocaleString('pl-PL', { minimumFractionDigits: 2 });

                return { searchForm, searchFlights, flights, hasSearched, isLoading, formatTime, formatDate, formatPrice };
            },
            template: `
                <div class="space-y-12">
                    <div class="relative bg-slate-900 rounded-[2.5rem] overflow-hidden shadow-2xl">
                        <div class="absolute inset-0 bg-gradient-to-br from-blue-900 via-slate-800 to-slate-900 opacity-95"></div>
                        <div class="relative z-10 px-6 py-16 md:py-24 max-w-5xl mx-auto text-center">
                            <h1 class="text-4xl md:text-6xl font-black text-white mb-6 tracking-tight">Gotowy na podróż?</h1>
                            <form @submit.prevent="searchFlights" class="bg-white p-3 rounded-3xl shadow-xl flex flex-col md:flex-row gap-2 items-center text-left">
                                <div class="flex-1 w-full px-4 py-2 border-b md:border-b-0 md:border-r border-slate-100">
                                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Skąd</label>
                                    <input v-model="searchForm.from" type="text" placeholder="Miasto wylotu" class="w-full bg-transparent text-lg font-bold outline-none">
                                </div>
                                <div class="flex-1 w-full px-4 py-2 border-b md:border-b-0 md:border-r border-slate-100">
                                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Dokąd</label>
                                    <input v-model="searchForm.to" type="text" placeholder="Miasto przylotu" class="w-full bg-transparent text-lg font-bold outline-none">
                                </div>
                                <div class="flex-1 w-full px-4 py-2">
                                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Data</label>
                                    <input v-model="searchForm.date" type="date" class="w-full bg-transparent text-lg font-bold outline-none text-slate-600">
                                </div>
                                <button type="submit" class="w-full md:w-auto h-16 px-10 bg-blue-600 text-white font-bold rounded-2xl hover:bg-blue-700 transition-all">Szukaj</button>
                            </form>
                        </div>
                    </div>
                    <div v-if="hasSearched" class="max-w-4xl mx-auto">
                        <div v-if="isLoading" class="text-center py-10">Ładowanie...</div>
                        <div v-else-if="flights.length === 0" class="text-center py-10 bg-white rounded-3xl border">Brak wyników.</div>
                        <div v-else class="space-y-4">
                            <div v-for="flight in flights" :key="flight.id_lotu" class="bg-white p-6 rounded-3xl border flex flex-col md:flex-row justify-between items-center">
                                <div>
                                    <span class="text-2xl font-black">{{ formatTime(flight.data_wylotu) }}</span>
                                    <span class="ml-4 text-slate-500 font-bold uppercase">{{ flight.miejsce_wylotu }} ✈ {{ flight.miejsce_przylotu }}</span>
                                </div>
                                <div class="text-right">
                                    <p class="text-2xl font-black text-blue-600">{{ formatPrice(flight.cena) }} PLN</p>
                                    <button @click="$router.push('/booking/' + flight.id_lotu)" class="bg-slate-900 text-white px-6 py-2 rounded-xl mt-2 font-bold hover:bg-slate-800 transition-all">Rezerwuj</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `
        };

        // -- NOWE: KOMPONENT REZERWACJI (MAPA MIEJSC + FORMULARZ PASAŻERA) --
        const Booking = {
            setup() {
                const route = useRoute();
                const router = useRouter();
                const flightId = route.params.id;

                const step = ref(1); // 1 - Mapa Miejsc, 2 - Dane Pasażera
                const selectedSeat = ref(null);
                const passenger = reactive({ imie: '', nazwisko: '' });

                // Mockowane dane miejsc (bazujące na Twoim seedzie SQL)
                const seats = ref([
                    { id: 1, numer_miejsca: '1A', klasa: 'Business', czy_wolne: false },
                    { id: 2, numer_miejsca: '1B', klasa: 'Business', czy_wolne: true },
                    { id: 3, numer_miejsca: '12A', klasa: 'Economy', czy_wolne: false },
                    { id: 4, numer_miejsca: '12B', klasa: 'Economy', czy_wolne: true },
                    { id: 5, numer_miejsca: '14A', klasa: 'Economy', czy_wolne: true },
                    { id: 6, numer_miejsca: '14B', klasa: 'Economy', czy_wolne: true },
                ]);

                const selectSeat = (seat) => {
                    if (seat.czy_wolne) {
                        selectedSeat.value = seat;
                    }
                };

                const getSeatClass = (seat) => {
                    if (selectedSeat.value && selectedSeat.value.id === seat.id) return 'seat-selected';
                    if (!seat.czy_wolne) return 'seat-occupied';
                    return 'seat-available';
                };

                const proceedToForm = () => {
                    if (selectedSeat.value) step.value = 2;
                };

                const submitBooking = () => {
                    if (passenger.imie && passenger.nazwisko) {
                        // Tutaj w przyszłości poleci zapytanie POST na backend
                        alert(`Sukces! Zarezerwowano miejsce ${selectedSeat.value.numer_miejsca} dla pasażera ${passenger.imie} ${passenger.nazwisko}.`);
                        router.push('/');
                    }
                };

                return { flightId, step, seats, selectedSeat, passenger, selectSeat, getSeatClass, proceedToForm, submitBooking };
            },
            template: `
                <div class="max-w-4xl mx-auto space-y-6">
                    <button @click="step === 2 ? step = 1 : $router.push('/')" class="text-blue-600 font-bold hover:underline mb-4 flex items-center">
                        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        Wróć
                    </button>

                    <div class="bg-white p-8 rounded-[2rem] shadow-xl border border-slate-100">
                        <div v-if="step === 1">
                            <h2 class="text-3xl font-black mb-2">Wybierz miejsce</h2>
                            <p class="text-slate-500 mb-8 font-semibold">Lot ID: {{ flightId }}</p>

                            <div class="flex space-x-6 mb-8 bg-slate-50 p-4 rounded-xl border border-slate-100">
                                <div class="flex items-center space-x-2">
                                    <div class="w-5 h-5 rounded-md bg-white border-2 border-slate-300"></div>
                                    <span class="text-sm font-bold text-slate-600">Wolne</span>
                                </div>
                                <div class="flex items-center space-x-2">
                                    <div class="w-5 h-5 rounded-md bg-slate-100 border-2 border-slate-200"></div>
                                    <span class="text-sm font-bold text-slate-600 line-through">Zajęte</span>
                                </div>
                                <div class="flex items-center space-x-2">
                                    <div class="w-5 h-5 rounded-md bg-blue-600 border-2 border-blue-700"></div>
                                    <span class="text-sm font-bold text-slate-600">Wybrane</span>
                                </div>
                            </div>

                            <div class="flex justify-center bg-slate-100 py-10 rounded-2xl border-2 border-slate-200">
                                <div class="grid grid-cols-2 gap-4">
                                    <div v-for="seat in seats" :key="seat.id" 
                                         @click="selectSeat(seat)"
                                         class="seat"
                                         :class="getSeatClass(seat)"
                                         :title="'Klasa: ' + seat.klasa">
                                        {{ seat.numer_miejsca }}
                                    </div>
                                </div>
                            </div>

                            <div class="mt-8 flex justify-end">
                                <button @click="proceedToForm" :disabled="!selectedSeat" 
                                    :class="selectedSeat ? 'bg-slate-900 hover:bg-slate-800' : 'bg-slate-300 cursor-not-allowed'"
                                    class="text-white px-8 py-3 rounded-xl font-bold transition-all shadow-md">
                                    Dalej: Dane Pasażera
                                </button>
                            </div>
                        </div>

                        <div v-if="step === 2">
                            <h2 class="text-3xl font-black mb-2">Dane Pasażera</h2>
                            <div class="bg-blue-50 text-blue-800 p-4 rounded-xl mb-6 font-bold flex items-center border border-blue-100">
                                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                Wybrane miejsce: {{ selectedSeat.numer_miejsca }} ({{ selectedSeat.klasa }})
                            </div>
                            
                            <form @submit.prevent="submitBooking" class="space-y-4">
                                <div>
                                    <label class="block text-sm font-bold text-slate-600 mb-1">Imię pasażera</label>
                                    <input v-model="passenger.imie" type="text" placeholder="Jan" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:border-blue-500 focus:bg-white transition-all font-semibold" required>
                                </div>
                                <div>
                                    <label class="block text-sm font-bold text-slate-600 mb-1">Nazwisko pasażera</label>
                                    <input v-model="passenger.nazwisko" type="text" placeholder="Kowalski" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:border-blue-500 focus:bg-white transition-all font-semibold" required>
                                </div>
                                
                                <div class="pt-4 border-t border-slate-100 mt-6 flex justify-end space-x-4">
                                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-xl font-bold transition-all shadow-lg shadow-blue-100">
                                        Potwierdź rezerwację
                                    </button>
                                </div>
                            </form>
                        </div>

                    </div>
                </div>
            `
        };

        // -- LOGOWANIE / REJESTRACJA (Zaktualizowane o nową klasę auth-switch-container z CSS) --
        const Login = { 
            setup() {
                const isRegisterMode = ref(false);
                const form = ref({ email: '', password: '', imie: '', nazwisko: '' });

                const handleAuth = async () => {
                    if (isRegisterMode.value) {
                        try {
                            const payload = {
                                email: form.value.email,
                                password: form.value.password, 
                                imie: form.value.imie,
                                nazwisko: form.value.nazwisko
                            };
                            await axios.post(`${API_URL}/auth/register`, payload);
                            alert("Rejestracja udana! Możesz się teraz zalogować.");
                            isRegisterMode.value = false;
                        } catch (e) {
                            alert("Błąd rejestracji:\n" + JSON.stringify(e.response?.data?.detail || e.message, null, 2));
                        }
                    } else {
                        try {
                            const p = new URLSearchParams();
                            p.append('username', form.value.email);
                            p.append('password', form.value.password);
                            const r = await axios.post(`${API_URL}/auth/login`, p);
                            setSession(r.data.access_token, form.value.email);
                            router.push('/');
                        } catch (e) {
                            alert("Błąd logowania:\n" + JSON.stringify(e.response?.data?.detail || e.message, null, 2));
                        }
                    }
                };
                return { isRegisterMode, form, handleAuth };
            },
            template: `
                <div class="max-w-md mx-auto">
                    <div class="bg-white p-10 rounded-[2.5rem] shadow-xl border border-slate-100">
                        <div class="flex justify-center mb-6">
                            <img src="logo.jpg" alt="Logo" class="h-16 w-auto object-contain">
                        </div>

                        <div class="auth-switch-container">
                            <button @click="isRegisterMode = false" 
                                :class="['auth-btn', !isRegisterMode ? 'auth-btn-active' : '']">
                                Login
                            </button>
                            <button @click="isRegisterMode = true" 
                                :class="['auth-btn', isRegisterMode ? 'auth-btn-active' : '']">
                                Rejestracja
                            </button>
                        </div>

                        <form @submit.prevent="handleAuth" class="space-y-4">
                            <div v-if="isRegisterMode" class="grid grid-cols-2 gap-4">
                                <input v-model="form.imie" type="text" placeholder="Imię" class="p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:border-blue-500 focus:bg-white transition-all" required>
                                <input v-model="form.nazwisko" type="text" placeholder="Nazwisko" class="p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:border-blue-500 focus:bg-white transition-all" required>
                            </div>
                            <input v-model="form.email" type="email" placeholder="Email" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:border-blue-500 focus:bg-white transition-all" required>
                            <input v-model="form.password" type="password" placeholder="Hasło" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:border-blue-500 focus:bg-white transition-all" required>
                            <button type="submit" class="w-full bg-slate-900 text-white font-bold py-5 rounded-2xl hover:bg-blue-600 transition-all mt-4">
                                {{ isRegisterMode ? 'Zarejestruj się' : 'Zaloguj się' }}
                            </button>
                        </form>
                    </div>
                </div>
            ` 
        };

        // ZMIANA: Dodano nową ścieżkę do rutera
        const routes = [
            { path: '/', component: Home }, 
            { path: '/login', component: Login },
            { path: '/booking/:id', component: Booking } // Nowa ścieżka
        ];
        
        const router = createRouter({ history: createWebHashHistory(), routes });
        
        const app = createApp({
            setup() {
                const isLoggedIn = computed(() => !!authToken.value);
                const logout = () => { clearSession(); router.push('/login'); };
                return { isLoggedIn, userEmail, logout };
            }
        });
        app.use(router);
        app.mount('#app');
    </script>
</body>
</html>
