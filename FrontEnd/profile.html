<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twój Profil - SkySecure</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="css/profile.css">
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="app" v-cloak>
        <header class="bg-white shadow-sm p-4 border-b border-slate-200">
            <div class="container mx-auto flex justify-between items-center">
                <div class="flex items-center space-x-3 cursor-pointer" @click="goToHome">
                    <img src="logo.jpg" alt="Logo" class="h-10 w-auto">
                    <span class="text-xl font-black uppercase tracking-tight">SkySecure</span>
                </div>
                <button @click="logout" class="text-red-500 font-bold hover:underline">Wyloguj</button>
            </div>
        </header>

        <main class="container mx-auto mt-10 p-4">
            <div class="max-w-2xl mx-auto bg-white rounded-[2.5rem] shadow-xl overflow-hidden border border-slate-100">
                <div class="bg-slate-900 p-10 text-center">
                    <div class="w-24 h-24 bg-blue-600 rounded-full mx-auto mb-4 flex items-center justify-center text-white text-4xl font-black shadow-lg">
                        {{ userInitials }}
                    </div>
                    <h1 class="text-white text-3xl font-black">{{ userName }} {{ userSurname }}</h1>
                    <p class="text-blue-400 font-bold uppercase tracking-widest text-xs mt-2">Stały Klient SkySecure</p>
                </div>

                <div class="p-10 space-y-6">
                    <div class="flex items-center space-x-4 p-4 bg-slate-50 rounded-2xl border border-slate-100">
                        <div class="text-slate-400">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                        </div>
                        <div>
                            <p class="text-[10px] font-black text-slate-400 uppercase">Adres Email</p>
                            <p class="font-bold text-slate-800">{{ userEmail }}</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div class="p-6 bg-blue-50 rounded-3xl border border-blue-100 text-center">
                            <p class="text-2xl font-black text-blue-600">0</p>
                            <p class="text-[10px] font-black text-blue-800 uppercase">Moje Loty</p>
                        </div>
                        <div class="p-6 bg-slate-900 rounded-3xl text-center">
                            <p class="text-2xl font-black text-white">Użytkownik</p>
                            <p class="text-[10px] font-black text-slate-400 uppercase">Status konta</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/profile.js"></script>
</body>
</html>
