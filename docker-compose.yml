services:
  db:
    image: postgres:15-alpine
    container_name: skysecure_db
    environment:
      POSTGRES_USER: skysecure_user
      POSTGRES_PASSWORD: skysecure_password
      POSTGRES_DB: skysecure_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./DataBase:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skysecure_user -d skysecure_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Брокер сообщений (Инфраструктура для SOA)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: skysecure_rabbitmq
    ports:
      - "5672:5672"   # Порт для микросервисов
      - "15672:15672" # Панель управления UI (http://localhost:15672)
    restart: unless-stopped

  # Микросервис генерации PDF (Consumer)
  pdf_worker:
    build: ./PdfService
    container_name: skysecure_pdf_worker
    depends_on:
      - rabbitmq
    volumes:
      - ./generated_pdfs:/app/pdfs
    restart: unless-stopped

  # Реплика API 1
  backend-1:
    build: ./BackEnd
    container_name: skysecure_backend_1
    env_file:
      - .env
    ports:
      - "8001:8000"
    volumes:
      - ./BackEnd:/app
      - ./generated_pdfs:/app/pdfs  # <-- ДОБАВИТЬ ЭТУ СТРОКУ
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    restart: unless-stopped

  # Реплика API 2
  backend-2:
    build: ./BackEnd
    container_name: skysecure_backend_2
    env_file:
      - .env
    ports:
      - "8002:8000"
    volumes:
      - ./BackEnd:/app
      - ./generated_pdfs:/app/pdfs  # <-- ДОБАВИТЬ ЭТУ СТРОКУ
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    restart: unless-stopped
  proxy:
    image: owasp/modsecurity-crs:nginx-alpine
    container_name: skysecure_proxy
    ports:
      - "80:80"
      - "443:443"
    environment:
      - MODSEC_RULE_ENGINE=On
      - PARANOIA=1
      - ANOMALY_INBOUND=5
      - ANOMALY_OUTBOUND=4
    volumes:
      - ./Nginx/nginx.conf:/etc/nginx/conf.d/skysecure.conf:ro
      - ./Nginx/certs:/etc/nginx/certs:ro
      - ./FrontEnd:/usr/share/nginx/html:ro
    depends_on:
      - backend-1
      - backend-2
    restart: unless-stopped

volumes:
  pgdata: