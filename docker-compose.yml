services:
  db:
    image: postgres:15-alpine
    container_name: skysecure_db
    environment:
      POSTGRES_USER: skysecure_user
      POSTGRES_PASSWORD: skysecure_password
      POSTGRES_DB: skysecure_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # Заглушка бэкенда (пока Дима пишет код)
  backend:
    image: python:3.10-slim
    container_name: skysecure_backend
    command: tail -f /dev/null
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    working_dir: /app
    restart: unless-stopped

  # Твой Nginx
  proxy:
    image: nginx:alpine
    container_name: skysecure_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata: