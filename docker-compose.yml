services:
  db:
    image: postgres:15-alpine
    container_name: skysecure_db
    environment:
      POSTGRES_USER: skysecure_user
      POSTGRES_PASSWORD: skysecure_password
      POSTGRES_DB: skysecure_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./DataBase:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skysecure_user -d skysecure_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./BackEnd
    container_name: skysecure_backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./BackEnd:/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # -------------------------------------------------------
  # WAF + Reverse Proxy
  # Образ owasp/modsecurity-crs:nginx-alpine содержит:
  #   • Nginx
  #   • ModSecurity v3 (libmodsecurity)
  #   • OWASP Core Rule Set (CRS) — набор правил WAF
  # -------------------------------------------------------
  proxy:
    image: owasp/modsecurity-crs:nginx-alpine
    container_name: skysecure_proxy
    ports:
      - "80:80"
      - "443:443"
    environment:
      - MODSEC_RULE_ENGINE=On
      - PARANOIA=1
      - ANOMALY_INBOUND=5
      - ANOMALY_OUTBOUND=4
    volumes:
      - ./Nginx/nginx.conf:/etc/nginx/conf.d/skysecure.conf:ro
      - ./Nginx/certs:/etc/nginx/certs:ro
      - ./FrontEnd:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata: